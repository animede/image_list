<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画像検索</title>
<style>
:root { --bg:#f6f6f4; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#ddddd8; --accent:#2f6fde; }
@media (prefers-color-scheme: dark) { :root { --bg:#171716; --fg:#ececea; --muted:#9a9a94; --card:#222220; --line:#353532; --accent:#6b9cf0; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui, "Noto Sans JP", sans-serif; }
header { position:sticky; top:0; z-index:2; background:var(--bg); border-bottom:1px solid var(--line); padding:12px 16px; }
.row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
input[type=search], input[type=text] { flex:1; min-width:200px; padding:9px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font-size:16px; }
button, label.btn { padding:8px 12px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); cursor:pointer; font-size:14px; white-space:nowrap; }
button:hover, label.btn:hover { border-color:var(--accent); }
#filterRow { margin-top:8px; font-size:13px; color:var(--muted); }
#filterRow input { width:200px; }
#status { color:var(--muted); font-size:13px; margin-top:6px; }
#settings { display:none; margin-top:8px; }
main { padding:16px; }
#info { color:var(--muted); font-size:13px; margin-bottom:10px; }
#grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(170px, 1fr)); gap:10px; }
.item { background:var(--card); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; }
.item img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:var(--line); }
.item .meta { padding:5px 8px; font-size:12px; color:var(--muted); display:flex; justify-content:space-between; gap:6px; }
.item .meta span:first-child { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
body.drag main { outline:3px dashed var(--accent); outline-offset:-8px; }
#viewer { position:fixed; inset:0; background:rgba(0,0,0,.85); display:none; flex-direction:column; align-items:center; justify-content:center; z-index:5; padding:16px; }
#viewer img { max-width:100%; max-height:calc(100vh - 110px); object-fit:contain; }
#viewer .bar { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; justify-content:center; align-items:center; color:#ddd; font-size:13px; }
#viewer .path { max-width:90vw; overflow-wrap:anywhere; }
</style>
</head>
<body>
<header>
  <div class="row">
    <input id="q" type="search" placeholder="文章で探す(例: 夕焼けの海、猫が寝ている、レシート)" autofocus>
    <label class="btn">画像で探す<input id="file" type="file" accept="image/*" hidden></label>
    <button id="toggleSettings">フォルダ設定</button>
  </div>
  <div class="row" id="filterRow">
    <label for="margin">絞り込み</label>
    <input id="margin" type="range" min="0.005" max="0.15" step="0.005">
    <span id="marginVal"></span>
  </div>
  <div id="settings" class="row">
    <input id="roots" type="text" placeholder="調べるフォルダ(複数は : で区切る)">
    <button id="saveRoots">保存して索引を作る</button>
    <button id="reindex">変更を取り込む</button>
  </div>
  <div id="status">読み込み中…</div>
</header>
<main>
  <div id="info">文章を入れるか、画像をここへドロップしてください。</div>
  <div id="grid"></div>
</main>
<div id="viewer">
  <img id="vimg" alt="">
  <div class="bar">
    <span class="path" id="vpath"></span>
    <button id="vsimilar">似た画像を探す</button>
    <button id="vopen">フォルダを開く</button>
    <button id="vclose">閉じる</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
let seq = 0, current = null, rootsLoaded = false;
// 1位との点数差がこの幅を超える画像は出さない。点数の水準は検索の種類で違うので、幅も種類ごとに覚える
const MARGIN_DEFAULT = { text: 0.03, image: 0.06 };
let mode = 'text', last = null;
function getMargin(m) { try { return +localStorage.getItem('margin_' + m) || MARGIN_DEFAULT[m]; } catch { return MARGIN_DEFAULT[m]; } }
function showMargin() { $('margin').value = getMargin(mode); $('marginVal').textContent = `1位との差 ${(+$('margin').value).toFixed(3)} 以内`; }
$('margin').addEventListener('input', () => {
  try { localStorage.setItem('margin_' + mode, $('margin').value); } catch {}
  showMargin();
  if (last) render(last.results, last.label);
});
showMargin();

async function api(url, opt) {
  const r = await fetch(url, opt);
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
  return r.json();
}

function render(all, label) {
  last = { results: all, label };
  const cut = all.length ? all[0].score - getMargin(mode) : 0;
  const results = all.filter(m => m.score >= cut);
  $('info').textContent = `${label} — ${results.length} 件` + (all.length > results.length ? `(似ていない ${all.length - results.length} 件は非表示)` : '');
  $('grid').replaceChildren(...results.map(m => {
    const d = document.createElement('div');
    d.className = 'item';
    const name = m.path.split('/').pop();
    d.innerHTML = `<img loading="lazy" alt=""><div class="meta"><span></span><span>${m.score.toFixed(3)}</span></div>`;
    d.querySelector('img').src = `/api/thumb/${m.id}`;
    d.querySelector('.meta span').textContent = name;
    d.title = m.path;
    d.onclick = () => openViewer(m);
    return d;
  }));
}

async function run(fn, label, m) {
  mode = m; showMargin();
  const my = ++seq;
  $('info').textContent = '検索中…';
  try {
    const res = await fn();
    if (my === seq) render(res.results, label);
  } catch (e) { if (my === seq) $('info').textContent = 'エラー: ' + e.message; }
}

let timer;
$('q').addEventListener('input', () => {
  clearTimeout(timer);
  const q = $('q').value.trim();
  if (!q) return;
  timer = setTimeout(() => run(() => api('/api/search?k=200&q=' + encodeURIComponent(q)), `「${q}」`, 'text'), 300);
});

function searchFile(f) {
  if (!f || !f.type.startsWith('image/')) return;
  $('q').value = '';
  run(() => api('/api/search_image?k=200', { method: 'POST', body: f }), `画像「${f.name}」に似たもの`, 'image');
}
$('file').onchange = e => searchFile(e.target.files[0]);
document.addEventListener('dragover', e => { e.preventDefault(); document.body.classList.add('drag'); });
document.addEventListener('dragleave', e => { if (!e.relatedTarget) document.body.classList.remove('drag'); });
document.addEventListener('drop', e => { e.preventDefault(); document.body.classList.remove('drag'); searchFile(e.dataTransfer.files[0]); });

function openViewer(m) {
  current = m;
  $('vimg').src = `/api/image/${m.id}`;
  $('vpath').textContent = `${m.path}  (${m.width}×${m.height})`;
  $('viewer').style.display = 'flex';
}
const closeViewer = () => { $('viewer').style.display = 'none'; $('vimg').src = ''; };
$('vclose').onclick = closeViewer;
$('viewer').onclick = e => { if (e.target.id === 'viewer') closeViewer(); };
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeViewer(); });
$('vsimilar').onclick = () => {
  const m = current; closeViewer(); $('q').value = '';
  run(() => api(`/api/similar/${m.id}?k=200`), `「${m.path.split('/').pop()}」に似た画像`, 'image');
};
$('vopen').onclick = () => api(`/api/open/${current.id}`, { method: 'POST' }).catch(e => alert(e.message));

$('toggleSettings').onclick = () => { const s = $('settings'); s.style.display = s.style.display === 'flex' ? 'none' : 'flex'; };
$('saveRoots').onclick = () => {
  const roots = $('roots').value.split(':').map(s => s.trim()).filter(Boolean);
  api('/api/roots', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ roots }) })
    .then(poll).catch(e => alert(e.message));
};
$('reindex').onclick = () => api('/api/reindex', { method: 'POST' }).then(poll).catch(e => alert(e.message));

const STATE = { idle: '待機中', scanning: 'フォルダを調べています', embedding: '索引を作っています', error: 'エラー' };
let pollTimer;
async function poll() {
  clearTimeout(pollTimer);
  try {
    const s = await api('/api/status');
    if (!rootsLoaded) { $('roots').value = s.roots.join(':'); rootsLoaded = true; }
    let t = `${s.count} 枚 ・ ${STATE[s.state] || s.state}`;
    if (s.state === 'embedding') t += ` ${s.done}/${s.total}`;
    if (s.errors) t += ` ・ 読めない画像 ${s.errors}`;
    if (s.message) t += ` ・ ${s.message}`;
    $('status').textContent = t + ` ・ ${s.device} ・ 画像 ${s.image_tokens} トークン`;
    if (s.state === 'scanning' || s.state === 'embedding') pollTimer = setTimeout(poll, 1500);
  } catch (e) { $('status').textContent = 'サーバーに接続できません'; pollTimer = setTimeout(poll, 5000); }
}
poll();
</script>
</body>
</html>
